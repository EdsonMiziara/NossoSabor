<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nosso Sabor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"

<body style="background-color: #efdac1;">

        <navbar-component></navbar-component>

        <div class="row justify-content-center">
            <div class="p-4 p-md-5 shadow-lg text-center overflow-hidden rounded-2"

                <div class="row g-4 justify-content-center pt-4">
                    <card-restaurante img="/src/cobos.png" nome="Cobbos Café"

            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
