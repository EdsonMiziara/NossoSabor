<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nosso Sabor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="icon" type="image/x-icon" href="/src/icone_nossosabor.png">
    <script src="/js/navbar.js" defer></script>
    <script src="/js/container-base.js" defer></script>
    <script src="/js/card-restaurante.js" defer></script>
    <script type="module" src="/js/carousel-componet.js"></script>
    <link rel="stylesheet" href="/styles/styles.css">
</head>

<body style="background-color: #efdac1;">
    <header>
        <navbar-component></navbar-component>
    </header>
    <main class="container" style="padding-top: 90px; padding-bottom: 40px;">
        <div class="row justify-content-center">
            <div class="p-4 p-md-5 shadow-lg text-center overflow-hidden rounded-2"
                style="background-color: #6f6c5c; color: #efdac1;">

                <h3 class="mb-4 border-bottom border-light pb-3">Restaurantes</h3>

                <div class="row g-4 justify-content-center pt-4 pb-3 border-bottom border-light">

                    <card-restaurante img="/src/cobos.jfif" nome="Cobbos Café"
                        descricao="Com um ambiente aconchegante, decoração charmosa,
                         uma grande variedade de doces, cafés e bebidas,
                          ela transforma uma simples pausa para um café em uma experiência especial."
                        nota="4.0">
                    </card-restaurante>

                    <card-restaurante img="/src/ilovesmash.jfif" nome="I Love Smash" descricao="Com um ambiente moderno e descontraído, decoração jovem, uma grande variedade de hambúrgueres smash, acompanhamentos crocantes,
                     ela transforma um simples lanche em uma experiência deliciosa e cheia de sabor."
                        nota="4.5">
                    </card-restaurante>

                    <card-restaurante img="/src/gostodefesta.jfif" nome="Gosto de Festa" descricao="Com um ambiente amplo e tradicional, decoração festiva, uma grande variedade de salgados, tortas, bolos artesanais e doces, ela transforma
                     uma simples comemoração ou lanche em uma experiência inesquecível e recheada de delícias." nota="4.5">
                    </card-restaurante>

                </div>
                <ul class="list-group pt-3">
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    Restaurantes Visitados
                    <span class="badge text-bg-primary rounded-pill">15</span>
                </li>
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    Restautes Avaliados
                    <span class="badge text-bg-primary rounded-pill">3</span>
                </li>
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    Media de Avaliações
                    <span class="badge text-bg-primary rounded-pill">4.3</span>
                </li>
                </ul>

            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>
