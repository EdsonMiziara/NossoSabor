<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nosso Sabor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="icon" type="image/x-icon" href="/src/icone_nossosabor.png">
    <script src="/js/navbar.js" defer></script>
    <script src="/js/container-base.js" defer></script>
    <link rel="stylesheet" href="/styles/styles.css">
</head>
<body>
    <header>
        <navbar-component></navbar-component>
    </header>

    <container-base titulo='Entre em Contato'>
        <div class="container my-4">
  <div class="row g-4 align-items-start">
    
    <div class="col-12 col-md-6">
      <form action="https://formspree.io/f/xvgdgggg" method="POST" class="p-3 rounded">
        <h2 class="text-center">Mande um email</h2>
        
        <div class="mb-3">
          <label for="nome" class="form-label">Seu nome</label>
          <input type="text" class="form-control" id="nome" name="nome" required>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Seu Email</label>
          <input type="email" class="form-control" id="email" name="email" required>
        </div>

        <div class="mb-3">
          <label for="msgEmail" class="form-label">Mensagem</label>
          <textarea class="form-control" id="msgEmail" name="mensagem" rows="3" required></textarea>
        </div>

        <button type="submit" class="btn btn-primary w-100">Enviar E-mail</button>
      </form>
    </div>

    <div class="col-12 col-md-6">
      <form action="https://wa.me/5534997766055" method="GET" target="_blank" class="p-3 rounded">
        <h2 class="text-center">Chame no Whatsapp</h2>

        <div class="mb-3">
          <label for="msgWhats" class="form-label">Mensagem</label>
          <textarea class="form-control" id="msgWhats" name="text" rows="3" required></textarea>
        </div>

        <button type="submit" class="btn btn-primary w-100">Iniciar conversa</button>
      </form>
    </div>

  </div>
</div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    </container-base>
</body>
</html>
