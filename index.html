<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nosso Sabor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"

<body style="background-color: #efdac1;">

        <navbar-component></navbar-component>

    <container-base>

        <h3 class="mb-4 border-bottom border-light pb-3 pt-3">Avaliações Recentes:</h3>
        <div class="row g-4 justify-content-center pt-4">
            <card-restaurante img="/src/cobos.png" nome="Cobbos Café"
